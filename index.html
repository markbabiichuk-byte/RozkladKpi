<title>Расписание Марка</title>

<style>
/* Layout: one phone-first column — "now" card on top, week + filter controls, sticky day chips, seven day cards like a printed timetable with a highlighter on the current pair */
:root {
  --paper: #f1f3f8;
  --card: #ffffff;
  --ink: #131a2c;
  --muted: #5b6377;
  --line: #dce1ea;
  --soft: #eceff5;
  --hl: #fff09a;
  --hl-ink: #5f4a00;
  --gym: #ad6400;
  --eng: #1c5dcf;
  --gran: #c21d2c;
  --church: #7737bb;
  --free: #11804a;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1017; --card: #161a24; --ink: #edf0f6; --muted: #9aa2b5; --line: #272d3b; --soft: #1e2330;
    --hl: #3b3410; --hl-ink: #ffd94a;
    --gym: #f3a43c; --eng: #6da8ff; --gran: #ff6b78; --church: #c69cff; --free: #52d78d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1017; --card: #161a24; --ink: #edf0f6; --muted: #9aa2b5; --line: #272d3b; --soft: #1e2330;
  --hl: #3b3410; --hl-ink: #ffd94a;
  --gym: #f3a43c; --eng: #6da8ff; --gran: #ff6b78; --church: #c69cff; --free: #52d78d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper);
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 40px;
  display: flex; flex-direction: column; gap: 14px;
}

/* header */
.top { display: flex; flex-direction: column; gap: 2px; }
.eyebrow { font: 600 12px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }

/* now card */
.now {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 12px;
}
.now-block { display: flex; flex-direction: column; gap: 6px; }
.now-block + .now-block { border-top: 1px dashed var(--line); padding-top: 12px; }
.now-label { display: flex; align-items: center; gap: 8px; font: 700 11.5px/1.2 var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); flex-wrap: wrap; }
.now-label .live { display: inline-flex; align-items: center; gap: 6px; background: var(--hl); color: var(--hl-ink); padding: 3px 8px; border-radius: 6px; }
.now-label .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .now-label .live::before { animation: none; } }
.now .rows { margin: 0; }
.now .row { padding: 4px 0; }
.now-empty { margin: 0; color: var(--muted); }

/* controls */
.controls { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.seg { display: flex; background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; flex: 1 1 220px; }
.seg button {
  flex: 1; border: 0; background: transparent; color: var(--muted);
  font: 600 14px/1 var(--font-body); padding: 10px 8px; border-radius: 9px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px;
}
.seg button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg .cur { font: 700 10px/1 var(--font-mono); letter-spacing: .05em; text-transform: uppercase; background: var(--hl); color: var(--hl-ink); padding: 3px 5px; border-radius: 4px; }
.switch {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font: 600 14px/1 var(--font-body); padding: 0 14px; border-radius: 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; min-height: 48px;
}
.switch .knob { width: 30px; height: 18px; border-radius: 9px; background: var(--line); position: relative; transition: background .15s; }
.switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); transition: transform .15s; }
.switch[aria-pressed="true"] .knob { background: var(--ink); }
.switch[aria-pressed="true"] .knob::after { transform: translateX(12px); }

/* sticky day chips */
.days {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); padding-block: 6px;
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
}
.days button {
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font: 600 13px/1 var(--font-mono); padding: 10px 0; border-radius: 10px; cursor: pointer; min-height: 40px;
}
.days button.is-today { background: var(--ink); color: var(--card); border-color: var(--ink); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* day cards */
.week { display: flex; flex-direction: column; gap: 12px; }
.day { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 8px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 64px); }
.day.is-today { border-color: var(--ink); }
.dh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dh h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.dh .date { font: 500 13px/1 var(--font-mono); color: var(--muted); }
.dh .today { font: 700 10.5px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; background: var(--hl); color: var(--hl-ink); padding: 4px 7px; border-radius: 5px; }
.free { margin-top: 4px; font-size: 13px; color: var(--free); font-weight: 600; }
.free b { font: 700 10.5px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; margin-right: 4px; }
.empty { margin: 8px 0 6px; color: var(--muted); font-size: 14px; }

.rows { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 12px;
  padding: 10px 8px; margin-inline: -8px; border-radius: 10px;
}
.day .row + .row { border-top: 1px solid var(--soft); }
.row.is-now { background: var(--hl); border-top-color: transparent; }
.row.is-now + .row { border-top-color: transparent; }
.row.is-past { opacity: .45; }
.time { display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.t1 { font: 700 15px/1.15 var(--font-mono); }
.t2 { font: 500 12.5px/1.15 var(--font-mono); color: var(--muted); }
.pair { margin-top: 4px; font: 600 10.5px/1 var(--font-mono); color: var(--muted); letter-spacing: .03em; }
.body { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.title { font-weight: 600; font-size: 15.5px; line-height: 1.3; overflow-wrap: anywhere; }
.k-gym .title { color: var(--gym); }
.k-eng .title { color: var(--eng); }
.k-gran .title { color: var(--gran); }
.k-church .title { color: var(--church); }
.row.is-now .title { color: var(--ink); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; color: var(--muted); }
.tag { font: 700 10.5px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--ink); }
.tag-pr { background: var(--soft); border-color: var(--soft); }
.tag-par { color: var(--muted); border-style: dashed; }
.links { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
  padding: 0 13px; border-radius: 999px; text-decoration: none;
  background: var(--ink); color: var(--card); font: 700 13px/1 var(--font-mono);
  border: 1px solid var(--ink);
}
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:hover { opacity: .88; }
.note { font-size: 12.5px; color: var(--muted); font-style: italic; }
button:focus-visible, .btn:focus-visible { outline: 2px solid var(--eng); outline-offset: 2px; }

footer { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
footer p { margin: 0; }

@media (min-width: 560px) {
  h1 { font-size: 34px; }
  .row { grid-template-columns: 70px minmax(0, 1fr); }
}
</style>
</head>

  <main class="week" id="week"></main>

  <footer>

</div>

  var ANCHOR = Date.UTC(2026, 10, 9); // понедельник первой недели
  var DAYS = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
  var DAYS_SHORT = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
  var DAYS_ON = ["в понедельник", "во вторник", "в среду", "в четверг", "в пятницу", "в субботу", "в воскресенье"];
  var MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  var PAIR = { "08:30": 1, "10:25": 2, "12:20": 3, "14:15": 4, "16:10": 5, "18:05": 6 };

  var fmt;
  try {
    fmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Kyiv", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  } catch (e) {
    fmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Kiev", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  }
  function weekOf(mondayUTC) {
    var diff = Math.round((mondayUTC - ANCHOR) / (7 * DAY));
    return ((diff % 2) + 2) % 2 === 0 ? 1 : 2;
  }
  function kyivNow() {
    var p = {};
    fmt.formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
    var dayUTC = Date.UTC(+p.year, +p.month - 1, +p.day);
    var dow = (new Date(dayUTC).getUTCDay() + 6) % 7;
    var monday = dayUTC - dow * DAY;
    return { dayUTC: dayUTC, dow: dow, mins: (+p.hour % 24) * 60 + (+p.minute), monday: monday, week: weekOf(monday) };
  }
  function toMin(t) { return +t.slice(0, 2) * 60 + +t.slice(3); }
  function dateLabel(utc) { var d = new Date(utc); return d.getUTCDate() + " " + MONTHS[d.getUTCMonth()]; }

  // ---------- state ----------
  var onlyClasses = false;
  try { onlyClasses = localStorage.getItem("onlyClasses") === "1"; } catch (e) {}
  var view = kyivNow().week;

  function items(week, dow) {
    return SCHEDULE[week][dow].items.filter(function (e) { return !onlyClasses || e.kind === "class"; });
  }

  // ---------- render ----------
  function rowHTML(e, extra) {
    var pair = e.kind === "class" && PAIR[e.s] ? '<span class="pair">' + PAIR[e.s] + " пара</span>" : "";
    var tags = "";
    if (e.type) tags += '<span class="tag' + (e.type === "Практика" ? " tag-pr" : "") + '">' + e.type + "</span>";
    if (e.par) tags += '<span class="tag tag-par">параллельно</span>';
    var meta = [e.who, e.room ? "ауд. " + e.room : ""].filter(Boolean).join(" · ");
    var links = (e.links || []).map(function (l) {
      return '<a class="btn' + (l.ghost ? " btn-ghost" : "") + '" href="' + l.url + '" target="_blank" rel="noopener noreferrer">' + l.label + ' <span aria-hidden="true">↗</span></a>';
    }).join("");
    var note = e.note ? '<span class="note">' + e.note + "</span>" : "";
    return '<li class="row k-' + e.kind + (extra ? " " + extra : "") + '">' +
      '<div class="time"><span class="t1">' + e.s + '</span><span class="t2">' + e.e + "</span>" + pair + "</div>" +
      '<div class="body"><div class="title">' + e.title + "</div>" +
      (tags || meta ? '<div class="meta">' + tags + (meta ? "<span>" + meta + "</span>" : "") + "</div>" : "") +
      (links || note ? '<div class="links">' + links + note + "</div>" : "") +
      "</div></li>";
  }

  function untilLabel(mins) {
    if (mins < 60) return "через " + mins + " мин";
    var h = Math.floor(mins / 60), m = mins % 60;
    return "через " + h + " ч" + (m ? " " + m + " мин" : "");
  }

  function renderNow(n) {
    var today = items(n.week, n.dow);
    var cur = today.filter(function (e) { return toMin(e.s) <= n.mins && n.mins < toMin(e.e); });
    var next = null;
    for (var off = 0; off < 14 && !next; off++) {
      var dayUTC = n.dayUTC + off * DAY;
      var dow = (n.dow + off) % 7;
      var wk = weekOf(dayUTC - dow * DAY);
      var evs = items(wk, dow).filter(function (e) { return off > 0 || toMin(e.s) > n.mins; });
      if (evs.length) {
        var first = Math.min.apply(null, evs.map(function (e) { return toMin(e.s); }));
        next = { off: off, dow: dow, start: first, list: evs.filter(function (e) { return toMin(e.s) === first; }) };
      }
    }
    var html = "";
    if (cur.length) {
      html += '<div class="now-block"><div class="now-label"><span class="live">Сейчас</span></div><ol class="rows">' +
        cur.map(function (e) { return rowHTML(e); }).join("") + "</ol></div>";
    }
    if (next) {
      var hhmm = next.list[0].s;
      var when = next.off === 0 ? "сегодня в " + hhmm + " · " + untilLabel(next.start - n.mins)
        : next.off === 1 ? "завтра в " + hhmm
        : DAYS_ON[next.dow] + " в " + hhmm;
      html += '<div class="now-block"><div class="now-label">Дальше · ' + when + '</div><ol class="rows">' +
        next.list.map(function (e) { return rowHTML(e); }).join("") + "</ol></div>";
    }
    if (!html) html = '<p class="now-empty">В ближайшие две недели ничего не запланировано.</p>';
    document.getElementById("now").innerHTML = html;
  }

  function renderControls(n) {
    [1, 2].forEach(function (w) {
      var b = document.getElementById("w" + w);
      b.setAttribute("aria-selected", String(view === w));
      b.innerHTML = w + " неделя" + (n.week === w ? ' <span class="cur">сейчас</span>' : "");
    });
    var sw = document.getElementById("onlyClasses");
    sw.setAttribute("aria-pressed", String(onlyClasses));
    document.getElementById("legend").hidden = onlyClasses;
    document.getElementById("dayNav").innerHTML = DAYS_SHORT.map(function (d, i) {
      var today = view === n.week && i === n.dow;
      return '<button type="button" data-day="' + i + '"' + (today ? ' class="is-today" aria-current="date"' : "") + ">" + d + "</button>";
    }).join("");
  }

  function renderWeek(n) {
    var monday = view === n.week ? n.monday : n.monday + 7 * DAY;
    document.getElementById("week").innerHTML = DAYS.map(function (name, i) {
      var list = items(view, i);
      var isToday = view === n.week && i === n.dow;
      var rows = list.map(function (e) {
        var c = "";
        if (isToday) {
          if (n.mins >= toMin(e.e)) c = "is-past";
          else if (n.mins >= toMin(e.s)) c = "is-now";
        }
        return rowHTML(e, c);
      }).join("");
      var d = SCHEDULE[view][i];
      var free = !onlyClasses && d.free ? '<div class="free"><b>Свободно</b> ' + d.free.join(" · ") + "</div>" : "";
      return '<section class="day' + (isToday ? " is-today" : "") + '" id="d' + i + '">' +
        '<header class="dh"><h2>' + name + '</h2><span class="date">' + dateLabel(monday + i * DAY) + "</span>" +
        (isToday ? '<span class="today">сегодня</span>' : "") + "</header>" + free +
        (rows ? '<ol class="rows">' + rows + "</ol>" : '<p class="empty">Пар нет</p>') + "</section>";
    }).join("");
  }

  var lastKey = "";
  function render(force) {
    var n = kyivNow();
    var key = n.dayUTC + ":" + n.mins + ":" + view + ":" + onlyClasses;
    if (!force && key === lastKey) return;
    lastKey = key;
    renderNow(n);
    renderControls(n);
    renderWeek(n);
  }

  // ---------- events ----------
  document.querySelector(".seg").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-week]");
    if (!b) return;
    view = +b.getAttribute("data-week");
    render(true);
  });
  document.getElementById("onlyClasses").addEventListener("click", function () {
    onlyClasses = !onlyClasses;
    try { localStorage.setItem("onlyClasses", onlyClasses ? "1" : "0"); } catch (e) {}
    render(true);
  });
  document.getElementById("dayNav").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-day]");
    if (!b) return;
    var el = document.getElementById("d" + b.getAttribute("data-day"));
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (el) el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  });

  render(true);
  setInterval(function () { render(false); }, 20000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) render(false); });
})();
</script>
</body>
</html>
